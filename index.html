<!DOCTYPE html>
<html>
<body>
<button onclick="test()">Trigger Test</button>
<script>
function test() {
    if (typeof window.jsInterface === 'undefined') {
        alert("RESULT: jsInterface NOT FOUND");
        return;
    }
    try {
        window.jsInterface.messageHandlers("madeFirstDeposit:99:USD");
        alert("RESULT: messageHandlers() called successfully - no JS exception");
    } catch(e) {
        alert("RESULT: JS ERROR - " + e.message);
    }
}
</script>
</body>
</html>
