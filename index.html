<!DOCTYPE html>
<html>
<body>
<button onclick="triggerBridge()">Trigger Native Bridge</button>
<div id="status"></div>
<script>
function triggerBridge() {
    var status = document.getElementById('status');
    if (typeof window.jsInterface === 'undefined') {
        status.innerHTML = 'jsInterface NOT FOUND';
        return;
    }
    status.innerHTML = 'jsInterface FOUND - invoking native bridge';
    window.jsInterface.messageHandlers("madeFirstDeposit:99:USD");
}
</script>
</body>
</html>
