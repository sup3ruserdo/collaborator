<body>
<button onclick="test()">Trigger Blob Download Bridge</button>
<div id="status"></div>
<script>
function test() {
    var status = document.getElementById('status');
    if (typeof window.DownloadPdfFileBlobData === 'undefined') {
        status.innerHTML = 'DownloadPdfFileBlobData NOT FOUND';
        return;
    }
    status.innerHTML = 'DownloadPdfFileBlobData FOUND - invoking bridge';
    window.DownloadPdfFileBlobData.getBase64FromBlobData("SGVsbG8gV29ybGQ=");
}
</script>
</body>
