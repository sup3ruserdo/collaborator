<!DOCTYPE html>
<html>
<body>
<button onclick="test()">Trigger setIframeTitle</button>
<script>
function test() {
    if (typeof window.windowPost === 'undefined') {
        alert("RESULT: windowPost NOT FOUND");
        return;
    }
    try {
        window.windowPost.setIframeTitle("<script>alert(22)</script>");
        alert("RESULT: setIframeTitle() called successfully - check screen title");
    } catch(e) {
        alert("RESULT: JS ERROR - " + e.message);
    }
}
</script>
</body>
</html>
